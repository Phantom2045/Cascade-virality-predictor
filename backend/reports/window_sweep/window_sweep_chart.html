<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Predictive Power vs. Observation Window</title>
<style>
  body { margin:0; padding:32px; background:#f3f4f6; font-family:"Segoe UI",Arial,sans-serif; }
  .card { max-width:960px; margin:0 auto; background:#fff; border-radius:14px;
          box-shadow:0 4px 24px rgba(0,0,0,.08); padding:28px; }
  h1 { margin:0 0 4px; font-size:20px; color:#111827; }
  p.sub { margin:0 0 18px; font-size:13px; color:#6b7280; }
</style>
</head>
<body>
<div class="card">
  <h1>Predictive Power vs. Observation Window</h1>
  <p class="sub">Same Random Forest pipeline (structure + timing features only) trained at five early-observation windows.</p>
  <svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
    <rect width="900" height="520" fill="#ffffff"/>

    <!-- Y gridlines -->
    <line x1="80" y1="420" x2="700" y2="420" stroke="#e5e7eb"/>
    <line x1="80" y1="360" x2="700" y2="360" stroke="#e5e7eb"/>
    <line x1="80" y1="300" x2="700" y2="300" stroke="#e5e7eb"/>
    <line x1="80" y1="240" x2="700" y2="240" stroke="#e5e7eb"/>
    <line x1="80" y1="180" x2="700" y2="180" stroke="#e5e7eb"/>
    <line x1="80" y1="120" x2="700" y2="120" stroke="#e5e7eb"/>
    <line x1="80" y1="60"  x2="700" y2="60"  stroke="#e5e7eb"/>

    <!-- Y tick labels -->
    <text x="70" y="424" text-anchor="end" font-size="12" fill="#6b7280">0.4</text>
    <text x="70" y="364" text-anchor="end" font-size="12" fill="#6b7280">0.5</text>
    <text x="70" y="304" text-anchor="end" font-size="12" fill="#6b7280">0.6</text>
    <text x="70" y="244" text-anchor="end" font-size="12" fill="#6b7280">0.7</text>
    <text x="70" y="184" text-anchor="end" font-size="12" fill="#6b7280">0.8</text>
    <text x="70" y="124" text-anchor="end" font-size="12" fill="#6b7280">0.9</text>
    <text x="70" y="64"  text-anchor="end" font-size="12" fill="#6b7280">1.0</text>

    <!-- Axes -->
    <line x1="80" y1="60" x2="80" y2="450" stroke="#9ca3af"/>
    <line x1="80" y1="450" x2="700" y2="450" stroke="#9ca3af"/>

    <!-- X tick labels -->
    <text x="80"  y="472" text-anchor="middle" font-size="12" fill="#6b7280">5</text>
    <text x="134" y="472" text-anchor="middle" font-size="12" fill="#6b7280">15</text>
    <text x="215" y="472" text-anchor="middle" font-size="12" fill="#6b7280">30</text>
    <text x="377" y="472" text-anchor="middle" font-size="12" fill="#6b7280">60</text>
    <text x="700" y="472" text-anchor="middle" font-size="12" fill="#6b7280">120</text>

    <!-- Axis titles -->
    <text x="390" y="502" text-anchor="middle" font-size="13" fill="#374151">Observation window T (minutes)</text>
    <text x="22" y="255" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90 22 255)">Score</text>

    <!-- Crossover marker near 60 min -->
    <line x1="377" y1="60" x2="377" y2="450" stroke="#eab308" stroke-dasharray="4 4"/>
    <text x="377" y="52" text-anchor="middle" font-size="11" fill="#a16207">RF overtakes naive &#8594;</text>

    <!-- RF ROC-AUC (green) -->
    <polyline points="80,221.28 133.91,164.04 214.78,134.04 376.52,93.90 700,86.88"
              fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="80" cy="221.28" r="4" fill="#16a34a"/>
    <circle cx="133.91" cy="164.04" r="4" fill="#16a34a"/>
    <circle cx="214.78" cy="134.04" r="4" fill="#16a34a"/>
    <circle cx="376.52" cy="93.90" r="4" fill="#16a34a"/>
    <circle cx="700" cy="86.88" r="4" fill="#16a34a"/>

    <!-- Naive PR-AUC (red) -->
    <polyline points="80,206.94 133.91,148.50 214.78,134.40 376.52,111.96 700,94.02"
              fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="80" cy="206.94" r="4" fill="#dc2626"/>
    <circle cx="133.91" cy="148.50" r="4" fill="#dc2626"/>
    <circle cx="214.78" cy="134.40" r="4" fill="#dc2626"/>
    <circle cx="376.52" cy="111.96" r="4" fill="#dc2626"/>
    <circle cx="700" cy="94.02" r="4" fill="#dc2626"/>

    <!-- RF PR-AUC (blue) -->
    <polyline points="80,286.56 133.91,177.84 214.78,163.14 376.52,109.68 700,105.60"
              fill="none" stroke="#2563eb" stroke-width="3"/>
    <circle cx="80" cy="286.56" r="4.5" fill="#2563eb"/>
    <circle cx="133.91" cy="177.84" r="4.5" fill="#2563eb"/>
    <circle cx="214.78" cy="163.14" r="4.5" fill="#2563eb"/>
    <circle cx="376.52" cy="109.68" r="4.5" fill="#2563eb"/>
    <circle cx="700" cy="105.60" r="4.5" fill="#2563eb"/>

    <!-- Legend -->
    <line x1="720" y1="90" x2="746" y2="90" stroke="#2563eb" stroke-width="3"/>
    <circle cx="733" cy="90" r="4.5" fill="#2563eb"/>
    <text x="754" y="94" font-size="12" fill="#374151">RF PR-AUC</text>

    <line x1="720" y1="120" x2="746" y2="120" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="733" cy="120" r="4" fill="#dc2626"/>
    <text x="754" y="124" font-size="12" fill="#374151">Naive baseline PR-AUC</text>

    <line x1="720" y1="150" x2="746" y2="150" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="733" cy="150" r="4" fill="#16a34a"/>
    <text x="754" y="154" font-size="12" fill="#374151">RF ROC-AUC</text>
  </svg>
</div>
</body>
</html>
